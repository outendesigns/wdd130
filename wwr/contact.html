<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Welcome to Rapids Whitewater Rafting! The home of the most extreme rapids and fun times. Use this page to contact us for any inquiries!">
    <meta name="author" content="Eric Outen" />
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us ≈ Rapids Whitewater Rafting</title>
</head>

<body>
    <header>
        <img src="images/logo.jpeg" alt="White Water Rafting Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-address">
            <h2>Rapids Whitewater Rafting</h2>
            <p>123 Main River Stree</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@rapidsrafting.com</p>
        </section>
        <section>
            <div class="flex-container">
                <div id="map">
                    <img src="images/map.jpg" alt="map of location" />
                </div>
                <div>
                    <div id="contact-form">
                        <form>
                            <table>
                                <tr>
                                    <td style="width:25%;">
                                        <label for="name">Name</label>
                                    </td>
                                    <td>
                                        <input type="text" id="name" name="name">
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <label for="email">Email</label>
                                    </td>
                                    <td>
                                        <input type="email" id="email" name="email">
                                    </td>
                                </tr>
                                <tr>
                                    <td rowspan="3">
                                        <p>Message Purpose</p>
                                    </td>
                                    <td>
                                        <label for="general">
                                            <input type="radio" id="general" name="purpose" value="general">
                                            General Inquiry
                                        </label>
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <input type="radio" id="reservation" name="purpose" value="reservation">
                                        <label for="reservation">Reservation Question</label>
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                                        <label for="suggestion">Website Suggestion</label>
                                    </td>
                                </tr>
                                <tr>
                                    <td colspan="2">
                                        <label for="message">Message</label><br />
                                        <textarea id="message" name="message"></textarea>
                                    </td>
                                </tr>
                                <tr>
                                    <td colspan="2">
                                        <input type="checkbox" id="subscribe" value="subscribe">
                                        <label for="checkbox">Please Subscribe me to the monthly newsletter</label>
                                    </td>
                                </tr>
                                <tr>
                                    <td colspan="2">
                                        <button type="submit">Get in Touch!</button>
                                    </td>
                                </tr>
                            </table>
                        </form>
                    </div>
                </div>
            </div>
        </section>
        <section class="employee-section">
            <h2>We Are Here to Serve You</h2>
            <div class="flex-container">
                <figure>
                    <img src="images/employees/employee_1.jpg" alt="employee one">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employees/employee_2.jpg" alt="employee two">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employees/employee_3.jpg" alt="employee three">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy;2026 ≈ Rapids Whitewater Rafting ≈ Eric Outen</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
